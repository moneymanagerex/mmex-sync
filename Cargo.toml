[package]
name = "mmex-sync"
version = "0.3.0"
edition = "2021"
authors = ["Wolfsolver"]
description = "A non-intrusive, Offline-First synchronization gateway for Money Manager Ex (MMEX) with multi-backend cloud support."

[lib]
name = "mmex_sync"
path = "src/lib.rs"

[[bin]]
name = "mmex-sync"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Local MMEX Database (Bundled SQLite without system OpenSSL dependencies)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Network and TLS (Pure rustls, no system OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities & OS Integration
tempfile = "3.16"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"
sys-locale = "0.3"


# Pure Rust Cryptography (RustCrypto)
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"

# Native GUI (Milestone 5)
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15", default-features = false, features = ["gtk3"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
winres = "0.1"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]


