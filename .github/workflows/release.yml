name: Cross-Platform Release & Build

on:
  push:
    branches: [ "rust", "stable" ] # Compila ad ogni push sui branch rust/stable per verifica
    tags:
      - 'v*'                       # Se fai push di un tag (es. v0.3.0), crea anche la Release con i binari!
  workflow_dispatch:               # Permette di avviarla a mano dal tab Actions di GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bin_name: mmex-sync
            asset_name: mmex-sync-linux-x86_64

          - os: windows-latest
            os_name: windows-x86_64
            target: x86_64-pc-windows-msvc
            bin_name: mmex-sync.exe
            asset_name: mmex-sync-windows-x86_64.exe

          - os: macos-latest
            os_name: macos-arm64 (Apple Silicon)
            target: aarch64-apple-darwin
            bin_name: mmex-sync
            asset_name: mmex-sync-macos-arm64

          - os: macos-latest
            os_name: macos-x86_64 (Intel)
            target: x86_64-apple-darwin
            bin_name: mmex-sync
            asset_name: mmex-sync-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & C dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary for distribution
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} ${{ matrix.asset_name }}

      # Carica i binari come artefatti scaricabili da GitHub Actions ad ogni push
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Estrazione versione e changelog per Release
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/stable'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/v\1/')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          MSG=$(git log -1 --pretty=format:"%b")
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "BODY<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      # Allega i 4 binari alla GitHub Release (sia su tag v* sia su push a stable)
      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.VERSION }}
          name: Release ${{ steps.release_meta.outputs.VERSION }}
          body: ${{ steps.release_meta.outputs.BODY }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
