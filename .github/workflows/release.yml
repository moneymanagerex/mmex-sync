name: Release

on:
  push:
    branches:
      - stable
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libappindicator3-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: mmex-sync
            asset_name: mmex-sync-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: mmex-sync.exe
            asset_name: mmex-sync-windows-x86_64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: mmex-sync
            asset_name: mmex-sync-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: mmex-sync
            asset_name: mmex-sync-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libappindicator3-dev
          
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish Release & Tag
    needs: build-binaries
    # Esegue solo se l'evento è un push su stable (salta in caso di dispatch manuale)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: cargo_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package ZIP Archives for Backwards Compatibility
        run: |
          TAG="${{ steps.cargo_version.outputs.tag }}"
          cd release-assets
          
          # Linux x86_64
          if [ -f "mmex-sync-linux-x86_64" ]; then
            mkdir -p tmp-linux && cp mmex-sync-linux-x86_64 tmp-linux/mmex-sync
            chmod +x tmp-linux/mmex-sync
            (cd tmp-linux && zip "../mmex-sync-${TAG}-linux.zip" mmex-sync)
            rm -rf tmp-linux
          fi
          
          # Windows x86_64 (genera sia -win.zip per il vecchio client JS, sia -windows.zip)
          if [ -f "mmex-sync-windows-x86_64.exe" ]; then
            mkdir -p tmp-win && cp mmex-sync-windows-x86_64.exe tmp-win/mmex-sync.exe
            (cd tmp-win && zip "../mmex-sync-${TAG}-win.zip" mmex-sync.exe)
            (cd tmp-win && zip "../mmex-sync-${TAG}-windows.zip" mmex-sync.exe)
            rm -rf tmp-win
          fi
          
          # macOS x86_64 & aarch64
          if [ -f "mmex-sync-macos-x86_64" ]; then
            mkdir -p tmp-macos && cp mmex-sync-macos-x86_64 tmp-macos/mmex-sync
            chmod +x tmp-macos/mmex-sync
            (cd tmp-macos && zip "../mmex-sync-${TAG}-macos.zip" mmex-sync)
            rm -rf tmp-macos
          fi
          if [ -f "mmex-sync-macos-aarch64" ]; then
            mkdir -p tmp-macos-arm && cp mmex-sync-macos-aarch64 tmp-macos-arm/mmex-sync
            chmod +x tmp-macos-arm/mmex-sync
            (cd tmp-macos-arm && zip "../mmex-sync-${TAG}-macos-arm64.zip" mmex-sync)
            rm -rf tmp-macos-arm
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cargo_version.outputs.tag }}
          name: Release ${{ steps.cargo_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
